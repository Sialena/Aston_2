
version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: user-service-db
    environment:
      POSTGRES_DB: firstdb
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 1
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: